# JVM arguments for Gradle build
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dkotlin.compiler.execution.strategy=in-process

# Enable AndroidX and Jetifier
android.useAndroidX=true
android.enableJetifier=true

# Network timeouts (for slow connections)
systemProp.gradle.internal.http.connectionTimeout=600000
systemProp.gradle.internal.http.socketTimeout=600000

# Gradle optimizations
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.configureondemand=true

# Kotlin incremental compilation
kotlin.incremental=true

# Optional: enable caching for faster builds
org.gradle.caching=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
